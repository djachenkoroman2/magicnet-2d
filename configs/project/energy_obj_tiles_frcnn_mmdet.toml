# MMDetection config for training Faster R-CNN r50 FPN on the tiled energy_obj variant.
# Detector swap per doc/training_recommendations.md: two-stage FPN detectors are a
# strong fit for the small-object regime and converge fast on a small dataset.
# COCO-pretrained weights are loaded via mmdet.checkpoint (load_from); the
# classification head is re-initialized automatically (num_classes patch in
# build_runtime_config). Tile input is 1280x1280; the (1333, 800) resize of the
# base config keeps chips at ~native scale.

[project]
name = "magicnet-2d"
run_name = "energy_obj_tiles_frcnn_mmdet"

[paths]
data_root = "data/energy_obj_tiles"
log_root = "log"
checkpoint_root = "checkpoints"
output_root = "outputs"

[mmdet]
config = "mmdet::faster_rcnn/faster-rcnn_r50_fpn_1x_coco.py"
checkpoint = "checkpoints/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"
disable_pretrained = false

[dataset]
type = "YOLOTxtDataset"
# Keep background chips in training; see doc/config_energy_obj_tiles.md.
filter_empty_gt = false
classes = [
  "substation",
  "supports 0,4",
  "supports 10",
  "supports 35",
  "transformer",
]

[dataset.train]
ann_file = "labels/train"
img_prefix = "images/train"

[dataset.val]
ann_file = "labels/val"
img_prefix = "images/val"

[dataset.test]
ann_file = "labels/test"
img_prefix = "images/test"

[train]
seed = 42
validate = true
amp = false
max_epochs = 100
batch_size = 8
num_workers = 8
checkpoint_interval = 2
max_keep_checkpoints = 3
logger_interval = 50
resume = ""

[inference]
device = "auto"
score_threshold = 0.3
batch_size = 1
output_subdir = "inference"
