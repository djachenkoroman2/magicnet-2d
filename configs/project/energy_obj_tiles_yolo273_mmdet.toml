# MMDetection config for the longer-horizon YOLOv3 run on the tiled energy_obj variant.
# Same setup as energy_obj_tiles_mmdet.toml but with the native COCO schedule horizon:
# max_epochs=273 lets the base MultiStepLR milestones (218, 246) actually fire, so the
# run tests "more epochs + proper LR annealing" against the 100-epoch bg16 baseline.
# Rationale and expected payoff: doc/experiments.md, section "Перспектива увеличения
# числа эпох". Dataset: data/energy_obj_tiles (16.3% background chips).

[project]
name = "magicnet-2d"
run_name = "energy_obj_tiles_yolo273"

[paths]
data_root = "data/energy_obj_tiles"
log_root = "log"
checkpoint_root = "checkpoints"
output_root = "outputs"

[mmdet]
config = "mmdet::yolo/yolov3_d53_8xb8-ms-608-273e_coco.py"
checkpoint = ""
disable_pretrained = false

[dataset]
type = "YOLOTxtDataset"
# Keep the background chips in training (mmdet YOLO configs otherwise
# set filter_empty_gt=True and silently drop them from the train split).
filter_empty_gt = false
classes = [
  "substation",
  "supports 0,4",
  "supports 10",
  "supports 35",
  "transformer",
]

[dataset.train]
ann_file = "labels/train"
img_prefix = "images/train"

[dataset.val]
ann_file = "labels/val"
img_prefix = "images/val"

[dataset.test]
ann_file = "labels/test"
img_prefix = "images/test"

[train]
seed = 42
validate = true
amp = false
max_epochs = 273
batch_size = 8
num_workers = 8
checkpoint_interval = 2
max_keep_checkpoints = 3
logger_interval = 50
resume = ""

[inference]
device = "auto"
score_threshold = 0.3
batch_size = 1
output_subdir = "inference"
