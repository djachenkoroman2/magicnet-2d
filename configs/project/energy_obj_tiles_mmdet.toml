# MMDetection config for training on the tiled energy_obj variant.
# Tiles make small objects resolvable at the model input size; training starts
# from COCO-pretrained weights (disable_pretrained = false). See
# doc/training_recommendations.md for the rationale and tile-size choice.

[project]
name = "magicnet-2d"
run_name = "energy_obj_tiles_mmdet"

[paths]
data_root = "data/energy_obj_tiles"
log_root = "log"
checkpoint_root = "checkpoints"
output_root = "outputs"

[mmdet]
config = "mmdet::yolo/yolov3_d53_8xb8-ms-608-273e_coco.py"
checkpoint = ""
disable_pretrained = false

[dataset]
type = "YOLOTxtDataset"
classes = [
  "substation",
  "supports 0,4",
  "supports 10",
  "supports 35",
  "transformer",
]

[dataset.train]
ann_file = "labels/train"
img_prefix = "images/train"

[dataset.val]
ann_file = "labels/val"
img_prefix = "images/val"

[dataset.test]
ann_file = "labels/test"
img_prefix = "images/test"

[train]
seed = 42
validate = true
amp = false
max_epochs = 100
batch_size = 8
num_workers = 8
checkpoint_interval = 2
max_keep_checkpoints = 3
logger_interval = 50
resume = ""

[inference]
device = "auto"
score_threshold = 0.3
batch_size = 1
output_subdir = "inference"
