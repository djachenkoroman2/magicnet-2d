# MMDetection config for the DINO-4scale r50 (improved 12e recipe) run on the
# tiled energy_obj variant. DINO is a DETR-family end-to-end detector — the
# modern-architecture comparison against the two-stage cascade leader
# (configs/project/energy_obj_tiles_cascade_ms3x_mmdet.toml). Same dataset and
# the YOLOTxtMetric evaluation; only the detector and its native 12-epoch
# schedule (AdamW, denoising queries, milestones [11]) differ.
# COCO-pretrained improved DINO weights via mmdet.checkpoint.
# Plan: doc/experiments.md, "modern architectures" priority.

[project]
name = "magicnet-2d"
run_name = "energy_obj_tiles_dino"

[paths]
data_root = "data/energy_obj_tiles"
log_root = "log"
checkpoint_root = "checkpoints"
output_root = "outputs"

[mmdet]
config = "configs/mmdet/dino-4scale_r50_energy.py"
checkpoint = "checkpoints/dino-4scale_r50_improved_8xb2-12e_coco_20230818_162607-6f47a913.pth"
disable_pretrained = false

[dataset]
type = "YOLOTxtDataset"
filter_empty_gt = false
classes = [
  "substation",
  "supports 0,4",
  "supports 10",
  "supports 35",
  "transformer",
]

[dataset.train]
ann_file = "labels/train"
img_prefix = "images/train"

[dataset.val]
ann_file = "labels/val"
img_prefix = "images/val"

[dataset.test]
ann_file = "labels/test"
img_prefix = "images/test"

[train]
seed = 42
validate = true
amp = false
# Native DINO 12-epoch horizon; RepeatDataset not used (end-to-end detector).
max_epochs = 12
# DINO is memory-hungry (900 queries, 6+6 transformer layers). Batch 2 at
# 800-1024 input fits an RTX 4090 24GB.
batch_size = 2
num_workers = 8
checkpoint_interval = 1
max_keep_checkpoints = 3
logger_interval = 50
resume = ""

[inference]
device = "auto"
score_threshold = 0.3
batch_size = 1
output_subdir = "inference"
