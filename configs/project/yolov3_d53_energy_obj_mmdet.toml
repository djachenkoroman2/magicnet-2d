# MMDetection config for training YOLOv3 on the prepared local energy_obj dataset.
# Source YOLO annotations use contiguous Label Studio class ids 0..4, so no
# class_id_map is needed.

[project]
name = "magicnet-2d"
run_name = "yolov3_d53_energy_obj_mmdet"

[paths]
data_root = "data/energy_obj"
log_root = "log"
checkpoint_root = "checkpoints"
output_root = "outputs"

[mmdet]
config = "mmdet::yolo/yolov3_d53_8xb8-ms-608-273e_coco.py"
checkpoint = ""
disable_pretrained = true

[dataset]
type = "YOLOTxtDataset"
classes = [
  "substation",
  "supports 0,4",
  "supports 10",
  "supports 35",
  "transformer",
]

[dataset.train]
ann_file = "labels/train"
img_prefix = "images/train"

[dataset.val]
ann_file = "labels/val"
img_prefix = "images/val"

[dataset.test]
ann_file = "labels/test"
img_prefix = "images/test"

[train]
seed = 42
validate = false
amp = false
max_epochs = 200
num_workers = 0
checkpoint_interval = 2
max_keep_checkpoints = 3
logger_interval = 50
resume = ""

[inference]
device = "auto"
score_threshold = 0.3
batch_size = 1
output_subdir = "inference"
